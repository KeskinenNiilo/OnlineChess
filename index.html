<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nettishakki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LANDING PAGE -->
    <div id="landing-page">
        <h1 class="game-title">Nettishakki</h1><br>
        <div class="menu-box">
            <button class="main-btn" onclick="createRoom()">Create Room</button>
            <div class="divider">OR</div>
            <div class="join-section">
                <input type="text" id="join-input" placeholder="Lobby Code">
                <button class="main-btn" onclick="joinRoom()">Join</button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" style="display: none;">

        <div id="top-bar">
            <h1 class="game-title">Nettishakki</h1>
        </div>

        <div class="game-container">

            <!-- LEFT SIDE -->
            <div class="board-section">
                <div id="chessboard"></div>
                <div id="turn-indicator"></div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="side-panel">

                <!-- ROOM CODE (now above scoreboard) -->
                <div id="lobby-display">
                    Code: <span id="code-text">----</span>
                </div>

                <!-- SCOREBOARD -->
                <div id="scoreboard-box">

                    <div class="scoreboard-header">⚔️ GAME STATS ⚔️</div>

                    <div class="scoreboard-content">

                        <div class="player-stats white-stats">
                            <span class="player-label">WHITE</span>
                            <span class="material-count">⚙️ <span id="whiteMaterial">0</span></span>
                            <span class="wins-count">🏆 <span id="whiteWins">0</span></span>
                            <span class="losses-count">💔 <span id="whiteLosses">0</span></span>
                        </div>

                        <div class="player-stats black-stats">
                            <span class="player-label">BLACK</span>
                            <span class="material-count">⚙️ <span id="blackMaterial">0</span></span>
                            <span class="wins-count">🏆 <span id="blackWins">0</span></span>
                            <span class="losses-count">💔 <span id="blackLosses">0</span></span>
                        </div>

                        <button onclick="declareDraw()" class="draw-btn">
                            ⚖️ DRAW ⚖️
                        </button>

                        <button onclick="forfeitGame()" class="forfeit-btn">
                            🏳️ FORFEIT 🏳️
                        </button>

                    </div>
                </div>
                <div id="log-container" class="log-container">
                    <div id="log-header" onclick="toggleLog()">
                        <span>📜 Game Log</span>
                        <span id="log-toggle-icon">▼</span>
                </div>
                <div id="log-body">
                    </div>
                </div>

            </div> <!-- END side-panel -->

        </div> <!-- END game-container -->

    </div> <!-- END game-screen -->

    <div id="status-message"></div>

    <script src="script.js"></script>
</body>
</html>
